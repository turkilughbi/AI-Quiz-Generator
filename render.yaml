services:
  - type: web
    name: ai-quiz-generator-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PUBLIC_DEMO
        value: 'true'
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: QUIZ_DB_PATH
        value: /tmp/quiz_history.sqlite3
